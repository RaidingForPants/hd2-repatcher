[project]
name = "hd2-repatcher"
version = "0.3.0"
description = "Repatches Helldivers II unit mods after game updates"
requires-python = ">=3.10"
dependencies = [
    "lz4==4.4.5",
    "platformdirs==4.9.6",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]
test = ["pytest>=8"]

[project.scripts]
hd2-repatcher = "update_unit_mods:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["update_unit_mods", "slim", "settings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
